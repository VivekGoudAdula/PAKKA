# 22 Diverse Hinglish & Devanagari Booking Dialogue Scenarios for Pakka Booking Brain
# Covers 1-utterance all-in-one, step-by-step, corrections, bargaining, Devanagari,
# mis-transcriptions, robot inquiries, human handoffs, silences, and re-ask fallbacks.

- id: scenario_01_all_in_one
  name: "All-in-one utterance with instant quote and confirmation"
  description: "Caller provides problem, address, and slot in a single initial sentence"
  dialogue:
    - user: "Geyser paani garam nahi kar raha, Mayur Vihar Pocket 1, shaam 5 baje aa jao"
    - user: "Theek hai, bhej do"
    - user: "Haan, pakka"
  expected:
    final_state: "BOOKED"
    slots:
      problem_key: "geyser_not_heating"
      landmark_address: "Mayur Vihar Pocket 1"
      time_slot: "5 Baje"
    is_terminal: true

- id: scenario_02_step_by_step
  name: "Standard step-by-step booking conversation"
  description: "Caller answers problem, address, and time slot one turn at a time"
  dialogue:
    - user: "Geyser se paani tapak raha hai"
    - user: "Mayur Vihar Phase 2 Pocket B"
    - user: "Kal subah bhej do"
    - user: "Haan theek hai"
    - user: "Haan, pakka"
  expected:
    final_state: "BOOKED"
    slots:
      problem_key: "geyser_leak"
      landmark_address: "Mayur Vihar Phase 2 Pocket B"
      time_slot: "Kal Subah (9 AM – 11 AM)"
    is_terminal: true

