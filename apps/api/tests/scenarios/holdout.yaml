- id: holdout_a_geyser_leak
  name: "a) geezer se pani tapak raha hai neeche se"
  description: "Problem extraction for geyser leakage"
  dialogue:
    - user: "bhaiya mera geezer se pani tapak raha hai neeche se"
  expected:
    final_state: "ASK_ADDRESS"
    slots:
      problem_key: "geyser_leak"

