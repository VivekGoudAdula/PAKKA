# ==============================================================================
# PAKKA NOISY STT EVALUATION SCENARIOS (30 SCENARIOS)
# ==============================================================================
# Simulates noisy telephony STT transcripts:
# - Dropped auxiliary words / articles
# - Phonetic vowel shifts and colloquial spellings ("geezer", "paini", "toti", "naali")
# - Truncated or informal landmarks ("saket metro", "rohini sec 8", "lajpat")
# - High background street noise / caller hesitations
# ==============================================================================

- id: noisy_01
  name: "Phonetic geezer not heating"
  utterance: "geezer paini garam nahi kar ra"
  expected:
    problem_key: "geyser_not_heating"

